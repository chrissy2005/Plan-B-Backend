name: Verify backend API
on:
  pull_request:
  push:
    branches: [main, fix/members-api-contract-audit]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planb_test
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: planb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planb_test -d planb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLANB_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/planb_test
      PLANB_TEST_DATABASE_USER: planb_test
      PLANB_TEST_DATABASE_PASSWORD: local-ci-test-only
      PGHOST: localhost
      PGUSER: planb_test
      PGDATABASE: planb_test
      PGPASSWORD: local-ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply actual production migrations to isolated database
        run: |
          for migration in database/00[1-8]*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Build and run PostgreSQL HTTP contract tests
        run: bash ./gradlew clean build --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/reports/tests/test
